<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Skincare na Prática</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: ebook em capítulos — sumário lateral no desktop, barra de progresso no topo, um capítulo por vez com anterior/próximo */
:root{
  --bg:#F4F6F4; --surface:#FFFFFF; --soft:#E7EDE9; --ink:#17221E; --muted:#5B6A64; --line:#D7DFDA;
  --accent:#2B6A5B; --accent-ink:#FFFFFF; --accent-soft:#D9EAE3; --blush:#F4D8CD; --blush-ink:#7A3B2A; --sun:#F4E4B6; --sun-ink:#6B4E0E;
  --photo:#FFFFFF;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1614; --surface:#18221F; --soft:#22302B; --ink:#E7EFEB; --muted:#9AAAA3; --line:#2C3B36;
  --accent:#7CC6B0; --accent-ink:#0C1B16; --accent-soft:#1F3A32; --blush:#4A2B24; --blush-ink:#F4C3B3; --sun:#43381A; --sun-ink:#F2D98E; --photo:#F2F2F0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1614; --surface:#18221F; --soft:#22302B; --ink:#E7EFEB; --muted:#9AAAA3; --line:#2C3B36;
  --accent:#7CC6B0; --accent-ink:#0C1B16; --accent-soft:#1F3A32; --blush:#4A2B24; --blush-ink:#F4C3B3; --sun:#43381A; --sun-ink:#F2D98E; --photo:#F2F2F0; color-scheme:dark}

[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;-webkit-text-size-adjust:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6}
h1,h2,h3{font-family:var(--display);line-height:1.1;text-wrap:balance;margin:0}
h1{font-size:clamp(2.3rem,7vw,3.4rem);font-weight:800;letter-spacing:-.025em}
h2{font-size:clamp(1.7rem,5vw,2.2rem);font-weight:800;letter-spacing:-.02em}
h3{font-size:1.08rem;font-weight:600}
p{margin:0}
ul,ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:5px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
img{display:block;max-width:100%}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.eyebrow{font-size:.74rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}

/* estrutura */
.shell{display:grid;grid-template-columns:1fr;min-height:100%}
@media (min-width:960px){.shell{grid-template-columns:260px 1fr}}
.side{display:none}
@media (min-width:960px){.side{display:flex;flex-direction:column;gap:4px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;padding:28px 16px;border-right:1px solid var(--line);background:var(--surface);overflow:auto}}
.side .ttl{font-family:var(--display);font-weight:800;font-size:1.1rem;padding:0 10px 14px}
.toc-item{display:grid;grid-template-columns:28px 1fr;align-items:center;gap:8px;text-align:left;background:none;border:0;border-radius:10px;padding:9px 10px;font-weight:600;font-size:.92rem;color:var(--muted)}
.toc-item .n{font-family:var(--display);font-variant-numeric:tabular-nums;font-size:.85rem}
.toc-item[aria-current="true"]{background:var(--accent-soft);color:var(--accent)}
.toc-item.seen .n::after{content:" ✓";font-size:.7rem}

.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);border-bottom:1px solid var(--line)}
.topbar-in{max-width:760px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:12px}
.topbar .chap{flex:1;min-width:0;font-weight:700;font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .chap span{color:var(--muted);font-weight:600;margin-right:6px;font-variant-numeric:tabular-nums}
.menu-btn{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:700;font-size:.85rem}
@media (min-width:960px){.menu-btn{display:none}}
.bar{height:3px;background:var(--soft)}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}

.main{min-width:0}
.page{max-width:760px;margin:0 auto;padding-inline:18px;padding-block:28px 40px;display:flex;flex-direction:column;gap:24px}
.pager{max-width:760px;margin:0 auto;padding-inline:18px;padding-block:0 48px;display:flex;gap:10px}
.pager button{flex:1;border-radius:14px;padding:14px 16px;text-align:left;border:1.5px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:2px;min-width:0}
.pager button small{font-size:.74rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.pager button b{font-family:var(--display);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pager .next{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);text-align:right}
.pager .next small{color:inherit;opacity:.8}
.pager button[hidden]{display:none!important}

/* sumário mobile */
.drawer{position:fixed;inset:0;z-index:30;background:rgba(10,20,16,.45);display:flex;align-items:flex-end}
.drawer-in{background:var(--surface);width:100%;border-radius:20px 20px 0 0;padding:18px 14px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:2px;max-height:85vh;overflow:auto}

/* componentes */
.box{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px}
.lead{font-size:1.08rem;color:var(--muted);max-width:60ch}
.hero-img{border-radius:20px;overflow:hidden;aspect-ratio:2/1;background:var(--soft)}
.hero-img img{width:100%;height:100%;object-fit:cover;object-position:center 35%}
.chapters{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:10px}
.chapters button{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:4px}
.chapters .n{font-family:var(--display);font-weight:800;color:var(--accent);font-size:1.3rem;font-variant-numeric:tabular-nums}
.chapters b{font-family:var(--display);font-weight:600}
.chapters span{font-size:.84rem;color:var(--muted);line-height:1.35}

.tips{list-style:none;padding:0;gap:0;counter-reset:n}
.tips li{counter-increment:n;display:grid;grid-template-columns:40px 1fr;gap:10px;padding:13px 0;border-top:1px solid var(--line)}
.tips li:first-child{border-top:0;padding-top:0}
.tips li:last-child{padding-bottom:0}
.tips li::before{content:counter(n,decimal-leading-zero);font-family:var(--display);font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums}

/* tipos */
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 15px;font-weight:600;font-size:.9rem}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.type-card{display:grid;grid-template-columns:1fr;gap:18px;align-items:center}
@media (min-width:640px){.type-card{grid-template-columns:1.1fr 1fr}}
.diagram{background:var(--photo);border-radius:14px;padding:12px}
.diagram figcaption{font-size:.78rem;color:#6b6b6b;text-align:center;margin-top:6px}
.type-card ul{gap:8px}
.pill{display:inline-block;font-size:.74rem;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}

/* teste */
.qcard{display:flex;flex-direction:column;gap:16px}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.dots{display:flex;gap:4px}
.dots i{width:16px;height:5px;border-radius:3px;background:var(--soft)}
.dots i.on{background:var(--accent)}
.opt{width:100%;text-align:left;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;display:flex;gap:12px;align-items:center;font-size:.97rem}
.opt .k{flex:none;width:28px;height:28px;border-radius:50%;background:var(--surface);border:1.5px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:.8rem}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-pressed="true"] .k{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opts{display:flex;flex-direction:column;gap:8px}
.textbtn{background:none;border:0;color:var(--muted);font-weight:600;padding:6px 0}
.bands{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;font-size:.74rem;text-align:center}
.bands div{background:var(--soft);border-radius:8px;padding:8px 2px;color:var(--muted);font-weight:600}
.bands b{display:block;font-variant-numeric:tabular-nums}
.bands div.on{background:var(--accent);color:var(--accent-ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:999px;padding:12px 20px;font-weight:700;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:10px}

/* tabelas chave-valor */
.kv{display:grid;grid-template-columns:minmax(100px,auto) 1fr;gap:10px 16px;margin:0}
.kv dt{font-weight:700;color:var(--accent)}
.kv dd{margin:0;min-width:0}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:10px}
.vcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px}
.vcard b{font-family:var(--display);font-size:1.05rem;font-weight:600}
.vcard span.d{font-size:.88rem;color:var(--muted);line-height:1.4}
.for{font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px;align-self:flex-start}
.for.o{background:var(--accent-soft);color:var(--accent)}
.for.s{background:var(--blush);color:var(--blush-ink)}
.for.t{background:var(--sun);color:var(--sun-ink)}

/* ativos */
.search{width:100%;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:12px 18px;font:inherit}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:10px}
.cat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.cat.dim{opacity:.35}
.cat h3{display:flex;justify-content:space-between;gap:8px}
.cat h3 small{font-family:var(--body);font-size:.78rem;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.cat .use{font-size:.84rem;color:var(--muted);margin-top:-6px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chips span{font-size:.8rem;background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:2px 8px}
.chips span.hit{background:var(--sun);border-color:var(--sun);color:var(--sun-ink);font-weight:700}

/* rotina */
.pyr{display:flex;flex-direction:column;align-items:center;gap:6px}
.pyr div{text-align:center;padding:10px;border-radius:10px;font-size:.9rem;font-weight:600}
.pyr small{display:block;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;opacity:.8}
.p1{width:46%;background:var(--sun);color:var(--sun-ink)}
.p2{width:72%;background:var(--blush);color:var(--blush-ink)}
.p3{width:100%;background:var(--accent-soft);color:var(--accent)}
.steps{display:flex;flex-direction:column;gap:10px}
.step{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;grid-template-columns:44px 1fr;gap:12px}
.step .no{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1.1rem}
.step.ess .no{background:var(--accent-soft);color:var(--accent)}
.step.ext .no{background:var(--blush);color:var(--blush-ink)}
.step.com .no{background:var(--sun);color:var(--sun-ink)}
.step .body{min-width:0;display:flex;flex-direction:column;gap:8px;font-size:.95rem}
.step .when{font-size:.8rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.group-label{font-family:var(--display);font-weight:600;font-size:1rem;margin-top:8px}

/* produtos */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:10px}
@media (max-width:420px){.pgrid{grid-template-columns:1fr 1fr}}
.prod{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.prod .ph{background:var(--photo);aspect-ratio:1/1;display:grid;place-items:center;padding:10px}
.prod .ph img{max-height:100%;object-fit:contain}
.prod .tx{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px}
.prod .tx small{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--accent)}
.prod .tx b{font-size:.88rem;font-weight:600;line-height:1.3}

/* desafio */
.lgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px}
.lcase{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.lcase img{width:100%;aspect-ratio:4/3;object-fit:cover}
.lcase .tx{padding:14px;display:flex;flex-direction:column;gap:6px;font-size:.92rem}
.verdict{font-size:.74rem;font-weight:700;padding:3px 10px;border-radius:999px;align-self:flex-start}
.checks{display:flex;flex-direction:column;gap:8px}
.checks label{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer}
.checks input{margin-top:4px;accent-color:var(--accent);width:18px;height:18px;flex:none}
.note{font-size:.8rem;color:var(--muted)}
.tips.box{padding:6px 20px}
.tips.box li:first-child{padding-top:13px}
.tips.box li:last-child{padding-bottom:13px}
@media (max-width:520px){
  .kv{grid-template-columns:1fr;gap:2px}
  .kv dd{margin-bottom:10px}
  .kv dd:last-child{margin-bottom:0}
  .step{grid-template-columns:1fr;gap:10px}
  .step .no{width:36px;height:36px;font-size:1rem}
  .box{padding:16px}
  .pager button{padding:12px 14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>


<div class="shell">
  <aside class="side" aria-label="Sumário"><div class="ttl">Skincare na Prática</div><div id="tocSide"></div></aside>
  <div class="main">
    <div class="topbar">
      <div class="topbar-in"><div class="chap" id="chapTitle"></div><button class="menu-btn" id="openToc">Sumário</button></div>
      <div class="bar"><i id="bar"></i></div>
    </div>
    <article class="page" id="page"></article>
    <nav class="pager" aria-label="Capítulos">
      <button id="prev"><small>Anterior</small><b id="prevT"></b></button>
      <button id="next" class="next"><small>Próximo</small><b id="nextT"></b></button>
    </nav>
  </div>
</div>
<div class="drawer" id="drawer" hidden><div class="drawer-in" id="tocMob"></div></div>

const STEPS=[
 ["ess","Diário","Essenciais",[
  ["Limpeza","Manhã e noite",`<p>Tira oleosidade, bactérias, suor, poluição e restos de maquiagem, evitando poros entupidos que viram cravos e espinhas. Sem limpeza, a pele também fica irritada e sensível.</p><dl class="kv"><dt>Oleosa a mista</dt><dd>Gel ou sabonete líquido com ativos adstringentes e antissépticos. Com acne, some cicatrizantes e anti-inflamatórios.</dd><dt>Normal a seca</dt><dd>Loção de limpeza, que limpa e também nutre.</dd></dl>`],
  ["Hidratação","Logo depois da limpeza",`<p>Devolve maciez e luminosidade e repõe o manto hidrolipídico, a película que segura a água na pele. Pele oleosa também precisa: excesso de sebo é sinal de desequilíbrio entre água e óleo.</p><dl class="kv"><dt>Oleosa a mista</dt><dd>Texturas leves e sem óleo: gel e gel-creme.</dd><dt>Normal a seca</dt><dd>Mais densas: creme ou loção cremosa.</dd></dl>`],
  ["Proteção solar","Todo dia, sempre o último passo",`<p>Inclusive em dia nublado. Aplique uma camada generosa, espalhando como se formasse um filtro por cima da pele.</p><dl class="kv"><dt>FPS</dt><dd>Protege do UVB, que causa vermelhidão, ardor e queimadura.</dd><dt>PPD / PA</dt><dd>Protege do UVA, ligado a manchas, envelhecimento e câncer de pele.</dd><dt>Com cor</dt><dd>Prefira. Os pigmentos bloqueiam também a luz visível, que piora manchas. Ou reforce com base líquida ou protetor em pó.</dd></dl>`]
 ]],

  ["Esfoliação","Oleosa até 2x por semana · Seca 1x",`<p>Tira células mortas, uniformiza a textura, devolve luminosidade, desentope poros e melhora a absorção dos outros produtos. Hidrate sempre depois.</p>`],
  ["Máscara facial","1 a 2x por semana",`<p>Fórmula concentrada para reforçar o cuidado: de hidratação intensa a efeito clareador (argila, creme, gel). Escolha pela necessidade da pele e siga o tempo da embalagem.</p>`]

  ["Clareadores","Manchas",`<p>Reduzem a produção de melanina ou despigmentam a área. Muitas vezes pedem indicação profissional, e protetor de FPS alto é obrigatório para não piorar as manchas.</p>`],
  ["Firmantes","Rugas e flacidez",`<p>Sol e idade ativam enzimas que quebram colágeno e elastina. Os firmantes ajudam a repor essas fibras, estimulam a pele a produzir mais e dão efeito tensor.</p>`]
 ]]
];
const PROD={
 o:{eco:[["Limpeza","Tracta Sabonete Facial Antiacne","p_tracta"],["Tônico","Faces Tônico Adstringente","p_faces_ads"],["Esfoliante","Neutrogena Acne Proofing","p_neutro"],["Hidratante","Nupill Derme Control Gel","p_nupill_dc"],["Protetor","ISDIN Fusion Water","p_isdin"],["Máscara","Argilas","p_argila"]],
    pre:[["Limpeza","Bioderma Sébium Gel","p_bioderma"],["Tônico","SkinCeuticals Blemish + Age","p_sk_blem"],["Esfoliante","Hidrabene Gel Esfoliante","p_hidrabene"],["Hidratante","Vichy Minéral 89","p_vichy"],["Protetor","SkinCeuticals UV Oil Defense FPS 80","p_sk_uv"],["Máscara","Quintal Argila Verde Antiacne","p_quintal"]]},
 s:{eco:[["Limpeza","Simple Moisturising Facial Wash","p_simple"],["Tônico","Faces Tônico Suavizante","p_faces_suav"],["Esfoliante","Nupill Firmness Gel Esfoliante","p_nupill_firm"],["Hidratante","Nivea Hidratante Protetor FPS 30","p_nivea"],["Protetor","Natura Fotoequilíbrio FPS 30","p_natura"],["Máscara","Argilas","p_argila"]],
    pre:[["Limpeza","CeraVe Loção de Limpeza","p_cerave"],["Tônico","Bioage Bio Hidrate Toner","p_bioage"],["Esfoliante","La Roche-Posay Gommage Surfin","p_lrp"],["Hidratante","Mantecorp Epidrat Calm","p_epidrat"],["Protetor","Sunmax FPS 50","p_sunmax"],["Máscara","Avène Gelée Gommante","p_avene"]]}
};

const st={ch:0, seen:new Set([0]), tipo:0, q:0, ans:{}, g:"o", tier:"eco", search:"", result:null};
try{ const s=JSON.parse(localStorage.getItem("snp")||"{}"); if(s.ans) st.ans=s.ans; if(s.result!=null) st.result=s.result; if(s.g) st.g=s.g; if(typeof s.ch==="number") st.ch=s.ch; (s.seen||[]).forEach(x=>st.seen.add(x)); }catch(e){}
function save(){ try{ localStorage.setItem("snp",JSON.stringify({ans:st.ans,result:st.result,g:st.g,ch:st.ch,seen:[...st.seen]})); }catch(e){} }
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
const $=s=>document.querySelector(s);

const CH=[
 {t:"Começo",s:"O que é skincare e como usar este guia",r:chCapa},
 {t:"Antes de começar",s:"10 coisas para ter em mente",r:chDez},
 {t:"Tipos de pele",s:"Como cada pele se comporta",r:chTipos},
 {t:"Teste de pele",s:"Descubra se a sua é oleosa ou seca",r:chTeste},
 {t:"Cosméticos e texturas",s:"Ativo, veículo e qual textura usar",r:chCosm},
 {t:"Ativos",s:"O que cada ingrediente faz",r:chAtivos},
 {t:"Rotina",s:"A pirâmide e cada passo explicado",r:chRotina},
 {t:"Sugestões de produtos",s:"Kits para pele oleosa e seca",r:chProd},
 {t:"Desafio",s:"Revise os produtos que você já tem",r:chDesafio}
];

function chCapa(){
  return `<div class="hero-img"><img src="${IMG.hero}" alt="Mulher aplicando creme no rosto"></div>
  <div style="display:flex;flex-direction:column;gap:12px"><span class="eyebrow">Guia interativo</span><h1>Skincare na prática</h1>
  <p class="lead">Skincare é a sua rotina de cuidados com a pele: os passos e os produtos do dia a dia. Aqui você descobre seu tipo de pele, entende o que cada produto faz e sai com uma rotina pronta.</p></div>
  <div class="row"><button class="btn" data-go="3">Começar pelo teste de pele</button><button class="btn ghost" data-go="1">Ler do início</button></div>
  <div class="chapters">${CH.slice(1).map((c,i)=>`<button data-go="${i+1}"><span class="n">${String(i+1).padStart(2,"0")}</span><b>${c.t}</b><span>${c.s}</span></button>`).join("")}</div>`;
}
function chDez(){
  const L=["Os melhores resultados vêm da parceria entre você e um profissional.","A pele é o maior órgão do corpo e merece cuidados especiais.","A pele do rosto é mais sensível que a do corpo. Por isso existem produtos só para ela.","Disciplina e constância: o resultado pode levar um tempo para aparecer.","Uma rotina curta e bem feita vale mais que uma rotina com muitos produtos.","Conheça seu tipo de pele e use produtos e texturas feitos para ele.","Talvez você não se adapte ao primeiro produto e precise trocar algumas vezes.","Defina suas prioridades e objetivos.","A rotina em casa complementa os procedimentos profissionais e acelera o resultado.","Não precisa pesar na rotina nem no bolso. Tem que ser um momento bom."];
  return head(1)+`<ol class="tips box">${L.map(x=>`<li>${x}</li>`).join("")}</ol>`;
}
function chTipos(){
  const T=TYPES[st.tipo];
  return head(2,"Toque em cada tipo para ver como ele se comporta.")+
  `<div class="seg" role="group" aria-label="Tipo de pele">${TYPES.map((x,i)=>`<button data-tipo="${i}" aria-pressed="${i===st.tipo}">${x.n}</button>`).join("")}</div>
  <div class="box type-card">
    <figure class="diagram" style="margin:0"><img src="${IMG[T.img]}" alt="Ilustração da pele ${T.n.toLowerCase()} em corte"><figcaption>${T.cap}</figcaption></figure>
    <div style="display:flex;flex-direction:column;gap:12px"><h3 style="font-size:1.4rem;font-weight:800">Pele ${T.n.toLowerCase()}</h3><ul>${T.t.map(x=>`<li>${x}</li>`).join("")}</ul>
    <span class="pill">Rotina: ${T.g==="o"?"mista a oleosa":"normal a seca"}</span></div>
  </div>
  <p class="small muted">Não sabe qual é a sua? O próximo capítulo tem um teste rápido.</p>`;
}
function chTeste(){
  if(st.result!=null && st.q===-1){
    const b=BANDS[st.result.band];
    return head(3)+`<div class="box type-card">
      <figure class="diagram" style="margin:0"><img src="${IMG[b.img]}" alt=""></figure>
      <div style="display:flex;flex-direction:column;gap:10px"><span class="eyebrow">Seu resultado · ${String(st.result.score).replace(".",",")} pontos</span><h3 style="font-size:1.6rem;font-weight:800">Pele ${b.l.toLowerCase()}</h3><p>${b.d}</p></div></div>
      <div class="bands">${BANDS.slice().reverse().map(x=>`<div class="${x===b?"on":""}"><b>${x.r}</b>${x.l}</div>`).join("")}</div>
      <div class="row"><button class="btn" data-go="7">Ver produtos para minha pele</button><button class="btn ghost" data-retake>Refazer o teste</button></div>`;
  }
  const i=Math.max(0,st.q), Q=QUIZ[i];
  return head(3,"Sistema Baumann de classificação: 11 perguntas sobre oleosidade e hidratação.")+
  `<div class="box qcard"><div class="qhead"><span class="eyebrow">Pergunta ${i+1} de ${QUIZ.length}</span><div class="dots">${QUIZ.map((_,k)=>`<i class="${st.ans[k]!=null?"on":""}"></i>`).join("")}</div></div>
   <h3 style="font-size:1.25rem">${Q[0]}</h3>${Q[2]?`<p class="small muted">${Q[2]}</p>`:""}
   <div class="opts">${Q[1].map((o,k)=>`<button class="opt" data-ans="${k}" aria-pressed="${st.ans[i]===k}"><span class="k">${"ABCDE"[k]}</span>${o}</button>`).join("")}</div>
   <div class="row" style="justify-content:space-between">${i>0?`<button class="textbtn" data-qback>← Pergunta anterior</button>`:"<span></span>"}${st.result!=null?`<button class="textbtn" data-showres>Ver último resultado</button>`:""}</div></div>`;
}
function chCosm(){
  return head(4)+`<p>Cosméticos são produtos de uso externo (pele, cabelo, unhas, lábios) para limpar, perfumar, proteger, conservar ou mudar a aparência. Os <b>cosmecêuticos</b> vão além: têm ativos mais potentes, com ação comprovada, que penetram a pele e tratam problemas específicos.</p>
  <div class="box"><h3 style="margin-bottom:12px">Do que um cosmético é feito</h3><dl class="kv"><dt>Princípio ativo</dt><dd>O que age e muda a pele. Ex.: antiacne, clareador, anti-idade.</dd><dt>Veículo</dt><dd>Dá a consistência e a forma final. Ex.: loção, espuma, óleo.</dd><dt>Aditivos</dt><dd>Completam a fórmula. Ex.: conservantes e pigmentos.</dd></dl></div>
  <h3>Qual textura combina com cada pele</h3>
  <div class="vgrid">${VEH.map(v=>`<div class="vcard"><b>${v[0]}</b><span class="d">${v[1]}</span><span class="for ${v[2]}">${v[3]}</span></div>`).join("")}</div>`;
}
function chAtivos(){
  return head(5,"Digite um ingrediente do rótulo do seu produto para ver o que ele faz.")+
  `<input class="search" id="q" type="search" placeholder="Ex.: niacinamida, ácido hialurônico" value="${st.search.replace(/"/g,"&quot;")}" aria-label="Buscar ativo">
   <p class="small muted" id="qres"></p><div class="cats" id="cats"></div>`;
}
function fillAtivos(){
  const q=norm(st.search.trim()); const hits=[];
  $("#cats").innerHTML=ATIVOS.map(([c,use,list])=>{ const m=q&&list.some(a=>norm(a).includes(q)); if(m) hits.push(c);
    return `<div class="cat ${q&&!m?"dim":""}"><h3>${c}<small>${list.length} ativos</small></h3><p class="use">${use}</p><div class="chips">${list.map(a=>`<span class="${q&&norm(a).includes(q)?"hit":""}">${a}</span>`).join("")}</div></div>`;}).join("");
  $("#qres").textContent=!q?"":hits.length?"Aparece em: "+hits.join(", ")+".":"Não está nesta lista. Pesquise no Google por \"glossário de ativos\" e o nome do ingrediente.";
}
function chRotina(){
  let n=0;
  return head(6,"Para ter uma pele bonita e saudável, o segredo é constância. Monte um cronograma com dias fixos para esfoliação e máscara.")+
  `<div class="box"><div class="pyr"><div class="p1"><small>Mensal</small>Limpeza de pele com profissional</div><div class="p2"><small>Semanal</small>Esfoliação · Máscara facial</div><div class="p3"><small>Diário</small>Limpeza · Hidratação · Protetor solar</div></div></div>
  <p class="small muted">Ordem: limpeza sempre primeiro, protetor solar sempre por último. Entre eles, a ordem é livre.</p>
  ${STEPS.map(([cls,freq,label,items])=>`<div class="group-label">${label} <span class="muted small" style="font-family:var(--body)">· ${freq}</span></div><div class="steps">${items.map(([t,w,b])=>`<div class="step ${cls}"><span class="no">${++n}</span><div class="body"><div><h3>${t}</h3><span class="when">${w}</span></div>${b}</div></div>`).join("")}</div>`).join("")}`;
}
function chProd(){
  const list=PROD[st.g][st.tier];
  return head(7, st.result!=null?`Selecionamos o kit pelo resultado do seu teste (pele ${BANDS[st.result.band].l.toLowerCase()}).`:"Escolha o seu tipo de pele.")+
  `<div class="row"><div class="seg"><button data-g="o" aria-pressed="${st.g==="o"}">Mista a oleosa</button><button data-g="s" aria-pressed="${st.g==="s"}">Normal a seca</button></div>
   <div class="seg"><button data-tier="eco" aria-pressed="${st.tier==="eco"}">Econômica</button><button data-tier="pre" aria-pressed="${st.tier==="pre"}">Premium</button></div></div>
   <div class="pgrid">${list.map(p=>`<div class="prod"><div class="ph"><img src="${IMG[p[2]]}" alt="${p[1]}" loading="lazy"></div><div class="tx"><small>${p[0]}</small><b>${p[1]}</b></div></div>`).join("")}</div>
   <p class="note">Exemplos de referência. Preço e disponibilidade variam, e talvez você precise testar mais de um até achar o ideal.</p>`;
}
function chDesafio(){
  const C=[
   ["l1","Combina com pele oleosa","o","A embalagem diz tudo: gel-creme, antiacne, reduz a oleosidade. Indicado para pele mista e oleosa."],
   ["l2","Serve para todos","t","No verso: oil free, para todos os tipos de pele. Quando a frente não explica, vire a embalagem."],
   ["l3","Serve até para oleosa","o","Não diz o tipo de pele nem o veículo, mas informa textura leve. Pode ser usado em pele mista a oleosa."],
   ["l4","Atenção se sua pele é oleosa","s","É um creme e não diz o tipo de pele. Em pele oleosa, cremes com óleo podem aumentar o sebo."]];
  return head(8,"Pegue os cosméticos de rosto que você já tem, principalmente os que comprou pela embalagem bonita, e descubra se eles servem para a sua pele.")+
  `<div class="lgrid">${C.map(c=>`<div class="lcase"><img src="${IMG[c[0]]}" alt="Exemplo de rótulo de cosmético" loading="lazy"><div class="tx"><span class="verdict for ${c[2]}">${c[1]}</span><p>${c[3]}</p></div></div>`).join("")}</div>
  <h3>Faça com os seus produtos</h3>
  <div class="checks">
   <label><input type="checkbox" id="c1">A frente diz para qual pele é? ("antiacne", "controla a oleosidade" = mista e oleosa)</label>
   <label><input type="checkbox" id="c2">Se não diz, o verso fala da textura? ("textura leve", "oil free", "toque seco")</label>
   <label><input type="checkbox" id="c3">É creme denso? Se sua pele é oleosa, prefira outro.</label>
   <label><input type="checkbox" id="c4">Busquei os ingredientes no capítulo de Ativos.</label>
  </div>
  <p class="note">Conteúdo educativo. Para acne inflamada, manchas persistentes ou irritação, procure um dermatologista ou esteticista.</p>`;
}
function head(i,sub){ return `<div style="display:flex;flex-direction:column;gap:10px"><span class="eyebrow">Capítulo ${String(i).padStart(2,"0")}</span><h2>${CH[i].t}</h2>${sub?`<p class="lead">${sub}</p>`:""}</div>`; }

function toc(){ return CH.map((c,i)=>`<button class="toc-item ${st.seen.has(i)?"seen":""}" data-go="${i}" aria-current="${i===st.ch}"><span class="n">${i===0?"—":String(i).padStart(2,"0")}</span>${c.t}</button>`).join(""); }
function render(top=true){
  st.seen.add(st.ch);
  $("#page").innerHTML=CH[st.ch].r();
  if(st.ch===5) fillAtivos();
  $("#chapTitle").innerHTML=st.ch?`<span>${String(st.ch).padStart(2,"0")}</span>${CH[st.ch].t}`:"Skincare na Prática";
  $("#bar").style.width=(st.ch/(CH.length-1)*100)+"%";
  $("#tocSide").innerHTML=toc(); $("#tocMob").innerHTML=toc();
  $("#prev").hidden=st.ch===0; $("#next").hidden=st.ch===CH.length-1;
  if(st.ch>0) $("#prevT").textContent=CH[st.ch-1].t;
  if(st.ch<CH.length-1) $("#nextT").textContent=CH[st.ch+1].t;
  save(); if(top) window.scrollTo({top:0});
}
function go(i){ st.ch=i; if(i===3) st.q = st.result!=null ? -1 : firstOpen(); $("#drawer").hidden=true; render(); }
function firstOpen(){ for(let k=0;k<QUIZ.length;k++) if(st.ans[k]==null) return k; return 0; }

document.addEventListener("click",e=>{
  if(e.target.id==="drawer"){ $("#drawer").hidden=true; return; }
  const b=e.target.closest("button"); if(!b) return; const d=b.dataset;
  if(b.id==="prev") return go(st.ch-1);
  if(b.id==="next") return go(st.ch+1);
  if(b.id==="openToc"){ $("#drawer").hidden=false; return; }
  if(d.go) return go(+d.go);
  if(d.tipo){ st.tipo=+d.tipo; return render(false); }
  if(d.ans!=null){
    const i=Math.max(0,st.q); st.ans[i]=+d.ans; render(false);
    setTimeout(()=>{
      if(i<QUIZ.length-1){ st.q=i+1; }
      else { let s=0; for(let k=0;k<QUIZ.length;k++) s+=PTS[st.ans[k]??1];
        const band=BANDS.findIndex(x=>s>=x.min); st.result={score:s,band}; st.g=BANDS[band].g; st.q=-1; }
      render(false);
    },200); return;
  }
  if(d.qback!=null){ st.q=Math.max(0,st.q-1); return render(false); }
  if(d.showres!=null){ st.q=-1; return render(false); }
  if(d.retake!=null){ st.ans={}; st.q=0; return render(false); }
  if(d.g){ st.g=d.g; return render(false); }
  if(d.tier){ st.tier=d.tier; return render(false); }
});
document.addEventListener("input",e=>{ if(e.target.id==="q"){ st.search=e.target.value; fillAtivos(); } });
document.addEventListener("keydown",e=>{ if(e.key==="Escape") $("#drawer").hidden=true; });

if(st.ch===3) st.q = st.result!=null ? -1 : firstOpen();
if(!CH[st.ch]) st.ch=0;
render(false);
</script>
